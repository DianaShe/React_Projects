<!DOCTYPE html>
<html lang="en">
<head>

    <title>Classes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
    <select class="select" name="color" id="color">

    <button class="btn" id="refill" type="button">Refill marker</button>
    <script src="index.js"></script>
